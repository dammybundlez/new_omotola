<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Omotola Jalade Ekeinde — A Legacy Etched in Time</title>
  <link rel="stylesheet" href="output.css">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

    <style>
        .flip-text {
  perspective: 1000px;
}

.flip-text {
  display: inline-block;
  transform-origin: 50% 100%;
  transform: rotateX(90deg);
  opacity: 0;
  filter: blur(6px);
}

/* When visible → animate */
.flip-text.is-visible  {
  animation: flipReveal 1.2s cubic-bezier(0.19, 1, 0.22, 1) forwards;
}

/* Stagger */
.flip-text.is-visible span:nth-child(1) { animation-delay: 0.1s; }
.flip-text.is-visible span:nth-child(2) { animation-delay: 0.3s; }
.flip-text.is-visible  { animation-delay: 0.5s; }

@keyframes flipReveal {
  0% {
    transform: rotateX(90deg);
    opacity: 0;
    filter: blur(6px);
  }
  60% {
    opacity: 1;
  }
  100% {
    transform: rotateX(0deg);
    opacity: 1;
    filter: blur(0);
  }
}

    </style>
</head>
<body>

  <!-- ================= HERO ================= -->
  <h2
  class="flip-text uppercase font-geist font-medium text-sm md:text-base tracking-[0.4em] text-amber-400 text-center"
  data-flip
>
  jome sweet home
</h2>




  <!-- ================= FOOTER ================= -->
  <footer>
    <p>
      © <span>Omotola Jalade Ekeinde</span> — Legacy. Influence. Impact.
    </p>
  </footer>

  <!-- ================= JS ================= -->
<script>
  const flipTexts = document.querySelectorAll('[data-flip]');

  const flipObserver = new IntersectionObserver(
    (entries, observer) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target); // run once
        }
      });
    },
    {
      threshold: 0.4, // sweet cinematic timing
    }
  );

  flipTexts.forEach(el => flipObserver.observe(el));
</script>

</body>
</html>
