<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Mother’s Love</title>

  <!-- Tailwind CDN -->
  <link rel="stylesheet" href="output.css">
  <!-- Font Awesome -->

</head>

<body class="bg-black text-white">

  <!-- HERO -->
  <section
    class="relative h-screen bg-cover bg-no-repeat bg-[center_50%]"
    style="background-image: url('public/emotymotherlove.png');"
  >

    <!-- Gradient Overlay -->
    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/60 to-black/10"></div>

    <!-- HEADER -->
    <header class="fixed top-0 w-full z-50 px-6 py-4 flex justify-between items-center">
      <img src="/public/logo1.jpg" class="w-10" />
      <nav class="hidden md:flex gap-10 uppercase text-sm">
        <a href="#" class="hover:text-amber-400">Films</a>
        <a href="#" class="hover:text-amber-400">News</a>
        <a href="#" class="hover:text-amber-400">Legacy</a>
        <a href="#" class="hover:text-amber-400">About</a>
        <a href="#" class="hover:text-amber-400">Contact</a>
      </nav>
    </header>

    <!-- CONTENT -->
    <div class="relative z-10 h-full flex items-end py-10 px-4 sm:px-6 md:px-10">
  <div class="flex flex-col lg:flex-row justify-between w-full gap-10">

    <!-- LEFT -->
    <div class="space-y-6 sm:space-y-7 animate-fadeUp opacity-0 font-inter max-w-xl">
      <h1 class="text-4xl sm:text-5xl md:text-[60px] font-semibold leading-tight">
        A MOTHER’S LOVE
      </h1>

      <div class="flex flex-wrap items-center gap-3 text-sm sm:text-base">
        <i class="fa-solid fa-star text-amber-300"></i>
        <p>9.2 | 1055</p>

        <div
          class="px-4 py-2 flex flex-wrap items-center gap-2
                 text-xs sm:text-sm
                 rounded-full bg-white/10 backdrop-blur-md
                 border border-white/20"
        >
          <span>1h 42m</span>
          <span class="opacity-60">•</span>
          <span>Family, Drama</span>
          <span class="opacity-60">•</span>
          <span>2025</span>
        </div>
      </div>

      <p class="text-sm sm:text-base opacity-90 animate-fadeUp delay-200">
        Next showing Today 3:15pm at B & B Omaha Oakview Plaza 14
      </p>

      <button
        class="animate-fadeUp delay-300
               bg-[#E7B005] hover:bg-amber-500
               transition-all duration-300 hover:scale-105
               px-6 py-3 rounded-md shadow-lg
               w-fit"
      >
        More Details
      </button>
    </div>

    <!-- RIGHT -->
    <div
      class="w-full lg:w-[45%]
             space-y-6 font-archivo
             animate-fadeUp delay-500 opacity-0"
    >

      <!-- Posters -->
      <div class="w-full">
        <h4 class="text-white font-medium text-lg sm:text-xl mb-3">
          Posters
        </h4>

        <div
          class="flex gap-4 overflow-x-auto
                 scroll-smooth scrollbar-hide
                 pb-2"
        >
          <!-- Poster -->
          <img src="public/herobg.webp"
            class="w-32 sm:w-36 h-20 flex-none object-cover rounded-lg
                   ring-1 ring-white/10
                   shadow-[0_20px_40px_rgba(0,0,0,0.6)]
                   transition-all duration-500 ease-out
                   hover:scale-110 hover:-translate-y-1
                   hover:ring-[#E7B005]"
          />

          <!-- Repeat posters -->
          <img src="public/1.png" class="w-32 sm:w-36 h-20 flex-none object-cover rounded-lg ring-1 ring-white/10 shadow-[0_20px_40px_rgba(0,0,0,0.6)] hover:scale-110 transition" />
          <img src="public/1.png" class="w-32 sm:w-36 h-20 flex-none object-cover rounded-lg ring-1 ring-white/10 shadow-[0_20px_40px_rgba(0,0,0,0.6)] hover:scale-110 transition" />
          <img src="public/1.png" class="w-32 sm:w-36 h-20 flex-none object-cover rounded-lg ring-1 ring-white/10 shadow-[0_20px_40px_rgba(0,0,0,0.6)] hover:scale-110 transition" />
          <img src="public/2.png" class="w-32 sm:w-36 h-20 flex-none object-cover rounded-lg ring-1 ring-white/10 shadow-[0_20px_40px_rgba(0,0,0,0.6)] hover:scale-110 transition" />
          <img src="public/3aa.jpg" class="w-32 sm:w-36 h-20 flex-none object-cover rounded-lg ring-1 ring-white/10 shadow-[0_20px_40px_rgba(0,0,0,0.6)] hover:scale-110 transition" />
        </div>
      </div>

      <!-- Cast -->
      <div class="space-y-4">
        <h4 class="text-white font-medium text-lg sm:text-xl">
          Top Cast
        </h4>

        <div class="flex flex-wrap gap-4 items-center">
          <!-- Cast item -->
          <div class="group relative text-center flex flex-col items-center">
            <img src="public/i1.png"
              class="w-14 h-14 rounded-full object-cover ring-2 ring-white/10
                     transition-all duration-300
                     group-hover:scale-110 group-hover:ring-[#E7B005]"
            />
            <span class="text-xs w-20 mt-2">Omotola Jalade</span>
          </div>

          <div class="group text-center flex flex-col items-center">
            <img src="public/i2.png" class="w-14 h-14 rounded-full object-cover ring-2 ring-white/10 group-hover:ring-[#E7B005] transition" />
            <span class="text-xs w-20 mt-2">Olumide Oworu</span>
          </div>

          <div class="group text-center flex flex-col items-center">
            <img src="public/i3.png" class="w-14 h-14 rounded-full object-cover ring-2 ring-white/10 group-hover:ring-[#E7B005] transition" />
            <span class="text-xs w-20 mt-2">Noray Nehita</span>
          </div>

          <div class="group text-center flex flex-col items-center">
            <img src="public/i4.png" class="w-14 h-14 rounded-full object-cover ring-2 ring-white/10 group-hover:ring-[#E7B005] transition" />
            <span class="text-xs w-20 mt-2">Nosa Rex</span>
          </div>

          <a
            href="details.html"
            class="px-4 h-9 inline-flex items-center justify-center
                   rounded-full text-sm font-medium
                   bg-[#E7B005] hover:bg-amber-500
                   transition-all duration-300 hover:scale-105
                   shadow-lg"
          >
            View all →
          </a>
        </div>
      </div>

    </div>
  </div>
</div>

  </section>

</body>
</html>
